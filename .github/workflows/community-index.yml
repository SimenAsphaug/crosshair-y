name: Community gallery

on:
  pull_request:
    paths: ["community/designs/**"]
  push:
    branches: [main]
    paths: ["community/designs/**", "scripts/build-community-index.mjs"]

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-community-index.mjs --check

  build-index:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-community-index.mjs
      - name: Commit index
        run: |
          if git diff --quiet community/index.json; then
            echo "Index unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add community/index.json
          git commit -m "Update community index"
          git push
