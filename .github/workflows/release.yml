name: Build & release

# Push a tag like v5.0.0 to build Windows + Linux packages and create a draft GitHub release.
# "Run workflow" (manual) builds the packages and attaches them to the run without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Use the tag as the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Type-check and build
        run: |
          npm run typecheck
          npm run build

      # Windows: Setup installer + portable .exe. Linux: AppImage.
      - name: Package
        run: npx electron-builder ${{ matrix.platform == 'win32' && '--win' || '--linux' }} --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: crosshair-y-${{ matrix.platform }}-x64
          path: |
            build/*.exe
            build/*.AppImage
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Created as a draft: review it on the Releases page, then click "Publish release".
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          prerelease=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease="--prerelease"; fi
          version="${GITHUB_REF_NAME#v}"
          cat > notes.md <<EOF
          ## Downloads

          | File | What it is |
          |---|---|
          | \`Crosshair-Y-Setup-${version}.exe\` | **Windows installer** (recommended). Adds Start menu and desktop shortcuts and an uninstaller. |
          | \`Crosshair-Y-${version}-portable.exe\` | **Windows portable**. One file, no install, just run it. |
          | \`Crosshair-Y-${version}.AppImage\` | **Linux**. Make it executable (\`chmod +x\`) and run it. |

          Windows may show a SmartScreen warning because the app isn't code-signed. Click **More info**, then **Run anyway**.

          EOF
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Crosshair Y ${version}" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag \
            --draft \
            $prerelease
